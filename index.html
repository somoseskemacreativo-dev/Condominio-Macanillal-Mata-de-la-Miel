<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Condominio Macanillal</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1E3A5F" />
  <style>
    :root {
      --bg: #F4F6F9;
      --card: #FFFFFF;
      --text: #1E293B;
      --muted: #64748B;
      --primary: #1E3A5F;
      --secondary: #C86D51;
      --accent: #10B981;
      --border: #E2E8F0;
      --input-bg: #F8FAFC;
      /* Colores de Mora en Modo Día (Tonos Rojos) */
      --mora-bg: #FEF2F2;
      --mora-border: #DC2626;
      --mora-text: #991B1B;
      --mora-badge: #DC2626;
    }

    body.dark {
      --bg: #111827;
      --card: #1F2937;
      --text: #E5E7EB;
      --muted: #9CA3AF;
      --primary: #7DA2C8;
      --secondary: #E09F87;
      --accent: #4ADE80;
      --border: #374151;
      --input-bg: #161F30;
      /* Colores de Mora en Modo Noche (Tonos Naranja suaves) */
      --mora-bg: #2A1C17;
      --mora-border: #F97316;
      --mora-text: #FDBA74;
      --mora-badge: #EA580C;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background-color 0.25s, color 0.25s;
    }

    .app-container {
      max-width: 500px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0 18px;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary);
    }

    .icon-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    /* Ventana destacada para propietarios en mora */
    .card.mora-card {
      background: var(--mora-bg);
      border: 2px solid var(--mora-border);
    }

    .mora-banner {
      background: var(--mora-badge);
      color: #FFFFFF;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .tab-btn {
      flex: 1;
      min-width: 90px;
      padding: 9px 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--muted);
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }

    body.dark .tab-btn.active {
      color: #111827;
    }

    .field {
      margin-bottom: 11px;
    }

    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 0.92rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .eye-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
    }

    .btn {
      width: 100%;
      padding: 11px;
      border-radius: 10px;
      border: none;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:active {
      opacity: 0.85;
    }

    .btn-primary {
      background: var(--primary);
      color: #FFFFFF;
    }

    body.dark .btn-primary {
      color: #111827;
    }

    .btn-accent {
      background: var(--accent);
      color: #FFFFFF;
    }

    body.dark .btn-accent {
      color: #111827;
    }

    .btn-secondary {
      background: var(--secondary);
      color: #FFFFFF;
    }

    body.dark .btn-secondary {
      color: #111827;
    }

    .btn-mora {
      background: var(--mora-badge);
      color: #FFFFFF;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      margin-top: 8px;
    }

    .btn-danger-sm {
      background: transparent;
      border: 1px solid var(--mora-border);
      color: var(--mora-border);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .top-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .amount-badge {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--accent);
    }

    .amount-badge.mora {
      color: var(--mora-border);
    }

    .progress-track {
      width: 100%;
      height: 13px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 99px;
      overflow: hidden;
      margin: 7px 0;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.3s ease;
    }

    .progress-fill.extra {
      background: var(--secondary);
    }

    .progress-fill.mora {
      background: var(--mora-badge);
    }

    .row-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.84rem;
      gap: 8px;
    }

    .muted {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .alert {
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.84rem;
      margin-bottom: 12px;
      background: var(--input-bg);
      border-left: 4px solid var(--secondary);
    }

    .list-item {
      padding: 11px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      margin-bottom: 8px;
    }

    details.mora-details {
      margin-top: 10px;
      border: 1px solid var(--mora-border);
      border-radius: 10px;
      padding: 8px 10px;
      background: var(--card);
    }

    details.mora-details summary {
      font-size: 0.83rem;
      font-weight: 700;
      color: var(--mora-text);
      cursor: pointer;
    }

    .table-wrap {
      overflow-x: auto;
      margin-top: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 6px 8px;
      text-align: left;
    }

    th {
      background: var(--input-bg);
      color: var(--muted);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 380px;
      padding: 18px;
    }

    .link-btn {
      background: none;
      border: none;
      color: var(--secondary);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      display: inline-block;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Edificio Macanillal</h1>
      <button class="icon-btn" id="btnSettings">Ajustes</button>
    </header>

    <main id="appRoot"></main>
  </div>

  <!-- Modal Ajustes -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal">
      <div class="row-between" style="margin-bottom: 14px;">
        <strong>Ajustes</strong>
        <button class="icon-btn" id="btnCloseSettings">✕</button>
      </div>

      <div class="field">
        <button class="btn btn-outline" id="btnToggleTheme">Cambiar Modo Día / Noche</button>
      </div>

      <div class="field">
        <a href="https://wa.me/+584123623243" target="_blank" rel="noopener" style="text-decoration:none;">
          <button class="btn btn-accent" type="button">Contactar Administración (WhatsApp)</button>
        </a>
      </div>

      <div class="field" id="logoutWrap" style="display:none; margin-top: 12px;">
        <button class="btn btn-secondary" id="btnLogout">Cerrar Sesión</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
